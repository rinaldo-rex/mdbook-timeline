<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Professional Legacy</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0a0a0a;
                --surface: #141414;
                --border: #2a2a2a;
                --text-primary: #e8e8e8;
                --text-secondary: #888;
                --text-muted: #555;
                --accent: #4a9ebb;
                --tag-bg: #1e1e1e;
                --tag-border: #333;
            }

            body {
                background: var(--bg);
                color: var(--text-primary);
                font-family: "DM Sans", sans-serif;
                font-weight: 300;
                line-height: 1.6;
                min-height: 100vh;
                padding: 0 0 80px;
            }

            /* ── Header ── */
            .header {
                padding: 64px 48px 48px;
                max-width: 900px;
            }
            .header h1 {
                font-family: "Playfair Display", serif;
                font-size: clamp(2rem, 5vw, 3rem);
                font-weight: 700;
                color: var(--text-primary);
                letter-spacing: -0.02em;
                margin-bottom: 12px;
            }
            .header p {
                font-size: 0.9rem;
                color: var(--text-secondary);
                max-width: 480px;
                line-height: 1.7;
            }

            /* ── Timeline wrapper ── */
            .timeline {
                position: relative;
                padding: 0 48px;
                max-width: 960px;
            }

            /* vertical line: 48px padding + 56px year col + 16px (half of 32px gap) = 120px */
            .timeline::before {
                content: "";
                position: absolute;
                left: 120px;
                top: 0;
                bottom: 0;
                width: 1px;
                background: var(--border);
            }

            /* ── Timeline entry ── */
            .entry {
                display: grid;
                grid-template-columns: 56px 1fr;
                gap: 0 32px;
                align-items: start;
                position: relative;
                /* no margin-bottom — spacing is handled by .duration-gap */
            }

            /* dot centred on the vertical line */
            .entry::before {
                content: "";
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: var(--text-muted);
                position: absolute;
                left: 72px;
                transform: translateX(-50%);
                top: 30px;
                z-index: 1;
                transition:
                    background 0.25s ease,
                    box-shadow 0.25s ease;
            }
            .entry.active::before {
                background: var(--accent);
                box-shadow: 0 0 0 3px rgba(74, 158, 187, 0.2);
            }

            /* year label */
            .entry-meta {
                display: flex;
                align-items: flex-start;
                justify-content: flex-end;
                padding-top: 26px;
                padding-right: 16px;
            }
            .entry-meta .year {
                font-size: 0.75rem;
                color: var(--text-muted);
                letter-spacing: 0.04em;
            }

            /* ── Duration labels (absolutely positioned by JS) ── */
            .duration-gap {
                margin-bottom: 32px;
            }
            .duration-label {
                position: absolute;
                /* left is set by JS to sit on the line */
                font-size: 0.62rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--text-muted);
                background: var(--bg);
                padding: 4px 0;
                writing-mode: vertical-rl;
                transform: translateX(-50%) translateY(-50%) rotate(180deg);
                z-index: 2;
                pointer-events: none;
            }
        </style>

        <!-- card styles -->
        <style>
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 28px 32px;
                position: relative;
            }

            .card .years-ago {
                position: absolute;
                bottom: 14px;
                right: 18px;
                font-size: 0.7rem;
                color: var(--text-muted);
                opacity: 0;
                transition: opacity 0.25s ease;
                pointer-events: none;
                letter-spacing: 0.03em;
            }

            .entry.hovered .card .years-ago {
                opacity: 1;
            }
            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 16px;
                margin-bottom: 8px;
            }
            .card-header h2 {
                font-family: "Playfair Display", serif;
                font-size: 1.15rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .badge-active {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 0.68rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--accent);
                border: 1px solid var(--accent);
                border-radius: 20px;
                padding: 4px 10px;
                white-space: nowrap;
                flex-shrink: 0;
            }
            .badge-active::before {
                content: "";
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
            }
            .card-company {
                font-size: 0.82rem;
                color: var(--text-secondary);
                margin-bottom: 14px;
            }
            .card-company span {
                color: var(--text-muted);
            }
            .card-desc {
                font-size: 0.875rem;
                color: var(--text-secondary);
                line-height: 1.75;
                margin-bottom: 20px;
            }
            .card-image {
                width: 100%;
                border-radius: 6px;
                overflow: hidden;
                margin-bottom: 18px;
                background: #1a1a1a;
            }
            .card-image img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                display: block;
                filter: grayscale(40%);
            }
            .card-images-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-bottom: 18px;
            }
            .card-images-grid .img-placeholder {
                background: #1c1c1c;
                border-radius: 6px;
                height: 160px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-muted);
                font-size: 0.75rem;
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .tag {
                font-size: 0.72rem;
                color: var(--text-secondary);
                background: var(--tag-bg);
                border: 1px solid var(--tag-border);
                border-radius: 4px;
                padding: 4px 10px;
                letter-spacing: 0.02em;
            }

            /* ── Hover dimming ── */
            .timeline.has-hover .entry {
                opacity: 0.3;
                transition: opacity 0.25s ease;
            }
            .timeline.has-hover .entry.hovered {
                opacity: 1;
            }
            .timeline.has-hover .entry.hovered::before {
                background: var(--accent);
                box-shadow: 0 0 0 3px rgba(74, 158, 187, 0.2);
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Professional Legacy</h1>
            <p>
                A chronological record of strategic growth, key achievements,
                and the evolution of a career spanning two decades of
                innovation.
            </p>
        </div>

        <div class="timeline" id="timeline">
            <!-- entries are injected by the script below -->
        </div>

        <script>
            const entries = [
                {
                    year: 2024,
                    active: true,
                    title: "Executive Director of Innovation",
                    company: "Global Tech Solutions",
                    location: "London, UK",
                    desc: "Leading the transformation of archival systems through AI-driven indexing and semantic search. Managed a team of 45 engineers to deliver the next generation of digital heritage platforms.",
                    tags: [
                        "Strategic Planning",
                        "AI Systems",
                        "Team Leadership",
                    ],
                },
                {
                    year: 2021,
                    title: "Senior Product Architect",
                    company: "CloudStream Infrastructure",
                    desc: "Spearheaded the migration of legacy data centers to a unified cloud architecture, reducing operational overhead by 34% and improving data retrieval speeds globally.",
                    image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=60",
                    imageAlt: "Data center",
                    tags: ["Architecture", "Migration"],
                },
                {
                    year: 2018,
                    title: "Lead UI/UX Strategist",
                    company: "Heritage Digital Agency",
                    desc: "Redefined the user journey for three Fortune 500 archival platforms. Focused on high-density data visualization and human-centric design patterns.",
                    imagePair: ["Design mockup", "UI prototype"],
                    tags: ["UI/UX", "Strategy"],
                },
                {
                    year: 2015,
                    title: "Full Stack Developer",
                    company: "OpenArchive Initiative",
                    desc: "Early pioneer in developing open-source protocols for decentralized data storage. Contributed to core libraries used by over 10,000 developers today.",
                    tags: ["Node.js", "Open Source"],
                },
            ];

            function durationLabel(yearA, yearB) {
                const diff = yearA - yearB;
                if (diff <= 0) return "< 1 Year";
                return diff === 1 ? "1 Year" : `${diff} Years`;
            }

            const CURRENT_YEAR = new Date().getFullYear();

            function yearsAgoLabel(year) {
                const diff = CURRENT_YEAR - year;
                if (diff === 0) return "This year";
                if (diff === 1) return "1 year ago";
                return `${diff} years ago`;
            }

            function renderEntry(e) {
                const locationHTML = e.location
                    ? ` <span>• ${e.location}</span>`
                    : "";
                const badgeHTML = e.active
                    ? `<span class="badge-active">Active Role</span>`
                    : "";

                let mediaHTML = "";
                if (e.image) {
                    mediaHTML = `<div class="card-image"><img src="${e.image}" alt="${e.imageAlt || ""}" /></div>`;
                } else if (e.imagePair) {
                    mediaHTML = `<div class="card-images-grid">
          <div class="img-placeholder">${e.imagePair[0]}</div>
          <div class="img-placeholder">${e.imagePair[1]}</div>
        </div>`;
                }

                const tagsHTML = e.tags
                    .map((t) => `<span class="tag">${t}</span>`)
                    .join("");

                return `
        <div class="entry${e.active ? " active" : ""}">
          <div class="entry-meta"><span class="year">${e.year}</span></div>
          <div class="card">
            <div class="card-header">
              <h2>${e.title}</h2>
              ${badgeHTML}
            </div>
            <div class="card-company">${e.company}${locationHTML}</div>
            <p class="card-desc">${e.desc}</p>
            ${mediaHTML}
            <div class="tags">${tagsHTML}</div>
            <span class="years-ago">${yearsAgoLabel(e.year)}</span>
          </div>
        </div>`;
            }

            function renderGap(yearA, yearB, index) {
                const label = durationLabel(yearA, yearB);
                return `<div class="duration-gap" data-gap="${index}" data-label="${label}"></div>`;
            }

            const container = document.getElementById("timeline");
            let html = "";
            entries.forEach((entry, i) => {
                html += renderEntry(entry);
                if (i < entries.length - 1) {
                    html += renderGap(entry.year, entries[i + 1].year, i);
                }
            });
            container.innerHTML = html;

            // Position each duration label at the midpoint between the two flanking dots
            function positionLabels() {
                const timelineEl = document.getElementById("timeline");
                const entryEls = timelineEl.querySelectorAll(".entry");
                const gapEls = timelineEl.querySelectorAll(".duration-gap");

                // The dot is at top: 30px within each entry (per CSS)
                const DOT_OFFSET = 30 + 4.5; // top + half dot height

                gapEls.forEach((gap, i) => {
                    const entryA = entryEls[i];
                    const entryB = entryEls[i + 1];

                    const dotATop =
                        entryA.getBoundingClientRect().top + DOT_OFFSET;
                    const dotBTop =
                        entryB.getBoundingClientRect().top + DOT_OFFSET;
                    const midY = (dotATop + dotBTop) / 2;

                    // Convert to position relative to timeline container
                    const containerTop = timelineEl.getBoundingClientRect().top;
                    const relativeY = midY - containerTop;

                    // line is at left: 120px from .timeline border-box
                    const label = document.createElement("span");
                    label.className = "duration-label";
                    label.textContent = gap.dataset.label;
                    label.style.left = "120px";
                    label.style.top = relativeY + "px";

                    timelineEl.appendChild(label);
                });
            }

            // Run after layout is complete
            requestAnimationFrame(() => requestAnimationFrame(positionLabels));

            // Hover dimming
            const timeline = document.getElementById("timeline");
            document.querySelectorAll(".entry").forEach((entry) => {
                entry.addEventListener("mouseenter", () => {
                    timeline.classList.add("has-hover");
                    entry.classList.add("hovered");
                });
                entry.addEventListener("mouseleave", () => {
                    timeline.classList.remove("has-hover");
                    entry.classList.remove("hovered");
                });
            });
        </script>
    </body>
</html>
